version: '3.9'

services:
  api:
    build: .
    container_name: gestor-soporte-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '3000:3000'
    volumes:
      - ./media:/app/media

  postgres:
    image: postgres:16-alpine
    container_name: gestor-soporte-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: soporte
      POSTGRES_USER: soporte
      POSTGRES_PASSWORD: soporte
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
